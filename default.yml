# default.yml controls global settings and policies/reports that run on all hosts ("All fleets").
labels:
  path: ./lib/all/labels/global-label.yml
policies:
reports:
agent_options:
controls:
org_settings:
  fleet_desktop:
    transparency_url: https://catoftheday.com
  server_settings:
    server_url: $FLEET_URL
  org_info:
    org_name: GRUBHUB
  secrets:
    - secret: "$FLEET_GLOBAL_ENROLL_SECRET"
  webhook_settings:
    activities_webhook:
      enable_activities_webhook: true
      destination_url: https://webhook.site/9fa455c9-bdc7-4fd0-8f6f-1be89fd0adb0
